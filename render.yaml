# =============================================================================
# RENDER BLUEPRINT (render.yaml) — Proyecto Biblioteca
# Ampliación Nivel Excelente (Criterios 4 y 5)
# Permite el despliegue sincronizado de Backend (Web Service) y Frontend (Static Site)
# =============================================================================
services:
  # ---------------------------------------------------------------------------
  # 1. Backend API (Web Service Node.js)
  # ---------------------------------------------------------------------------
  - type: web
    name: biblioteca-backend
    runtime: node
    plan: free
    region: frankfurt # o oregon
    rootDir: backend
    buildCommand: npm install && npm run build && npx prisma db push && node src/seed.js
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: API_KEY
        generateValue: true # Genera un token aleatorio seguro en Render
      - key: FRONTEND_URL
        value: https://biblioteca-frontend-adrian.onrender.com

  # ---------------------------------------------------------------------------
  # 2. Frontend SPA (Static Site Vite + React)
  # ---------------------------------------------------------------------------
  - type: static
    name: biblioteca-frontend
    plan: free
    region: frankfurt
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      # Regla de reescritura para rutas de Single Page Application (SPA)
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_URL
        value: https://biblioteca-backend-adrian.onrender.com/api
