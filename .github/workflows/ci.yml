name: Integración Continua (CI)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    name: Backend CI (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar generación de cliente Prisma y migración DB
        env:
          DATABASE_URL: 'file:./dev.db'
          API_KEY: 'test_api_key_ci'
        run: |
          npm run prisma:generate
          npx prisma db push
          npm run db:seed

  frontend-checks:
    name: Frontend CI (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar ESLint
        run: npm run lint

      - name: Ejecutar Tests Unitarios (Vitest)
        run: npm test

      - name: Comprobar Build de Producción (Vite)
        env:
          VITE_API_URL: 'https://biblioteca-backend-adrian.onrender.com/api'
        run: npm run build
